IINACT always checks the parser once a second and writes what it finds to the Dalamud log.\nWhen this is on and one of the parser's worker threads has stopped, IINACT starts it again and says so in chat.\nA thread that is stuck but still running is never restarted: disable and re-enable IINACT in the plugin installer instead.==IINACT 每秒檢查一次解析器，結果一律寫進 Dalamud 的記錄檔。\n打開時，解析器的工作執行緒若已停止，IINACT 會把它重新啟動，並在聊天視窗告訴你。\n還在執行但卡住的執行緒不會被重啟：請改到插件安裝器停用再啟用 IINACT。
IINACT: ?? - restarted it.==IINACT：??，已重新啟動。
